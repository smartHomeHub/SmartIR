name: Command regressions

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/requirements.txt
      - name: Obtain pinned upstream source for native-method contracts
        env:
          SMARTIR_BROADLINK_SOURCE: ${{ runner.temp }}/ha-broadlink-remote.py
        run: >-
          curl --fail --location --retry 3
          https://raw.githubusercontent.com/home-assistant/core/2026.8.3/homeassistant/components/broadlink/remote.py
          --output "$SMARTIR_BROADLINK_SOURCE"
      - name: Run isolated regressions and hash-verified native-method contracts
        env:
          SMARTIR_BROADLINK_SOURCE: ${{ runner.temp }}/ha-broadlink-remote.py
        run: python -B -m unittest discover -s tests -v

  native-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMARTIR_NATIVE_HA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - run: python -m pip install -r tests/native_ha/requirements.txt
      - name: Run native HA interfaces without integration startup or hardware
        run: python -B -m unittest tests.native_ha.test_runtime -v
